 composition: N2 78%, O2 21%, CO2 0.04%, noble gases, water vapour",detailZh:"氮氣最穩定稀釋氧氣，氧氣供呼吸燃燒，二氧化碳光合作用原料。比例近乎恆定但水蒸氣變化大。",detailEn:"Nitrogen dilutes oxygen, oxygen for respiration, CO2 for photosynthesis. Water vapour varies."},{zh:"7.2 氣體檢驗：O2 發光線香復燃 CO2 石灰水變混濁 H2O 氯化鈷藍→粉紅",en:"Gas tests: O2 glowing splint relights, CO2 limewater milky, H2O cobalt chloride blue→pink",detailZh:"檢驗需對照：氧氣助燃、二氧化碳與氫氧化鈣生成碳酸鈣沉澱、無水氯化鈷遇水變色。",detailEn:"CO2 + Ca(OH)2 → CaCO3 + H2O milky. Cobalt chloride anhydrous blue → hydrated pink."},{zh:"7.3 光合作用：6CO2+6H2O→C6H12O6+6O2 需光與葉綠素",en:"Photosynthesis: 6CO2+6H2O → C6H12O6+6O2 needs light chlorophyll",detailZh:"葉綠體內進行，光能轉化學能，產生葡萄糖與氧。反應式需平衡，證明需要光的實驗用遮光。",detailEn:"Chloroplast, light energy → chemical. Starch is storage form."},{zh:"7.4 澱粉測試四部曲：沸水軟化→酒精脫色→清水沖洗→碘液測試藍黑",en:"Starch test 4 steps: boil soften → ethanol decolor → rinse → iodine blue-black",detailZh:"沸水殺死細胞，酒精去除葉綠素，碘遇澱粉變藍黑色，證明光合作用產生澱粉。",detailEn:"Ethanol must be heated in water bath, not direct flame. Safety."},{zh:"7.5 呼吸作用：C6H12O6+6O2→6CO2+6H2O+能量 與光合作用相反",en:"Respiration: C6H12O6+6O2 →6CO2+6H2O+energy opposite photosynthesis",detailZh:"所有生物細胞線粒體進行，日夜進行，分解葡萄糖釋放能量供生命活動。",detailEn:"Mitochondria, occurs day and night, uses O2 produces CO2."},{zh:"7.6 肺泡氣體交換與空氣質素：薄壁濕潤豐富微血管 擴散作用",en:"Alveoli gas exchange & air quality: thin moist rich blood supply diffusion",detailZh:"肺泡一大一薄一濕一多血管，O2入血CO2出，污染物PM2.5 SO2 NOx CO影響健康與酸雨。",detailEn:"Diffusion down concentration gradient. Pollutants cause respiratory issues, acid rain."}],questions:[{id:"7-1",type:"mc",questionZh:"空氣中含量最多的氣體是？",questionEn:"Which gas is most abundant in air?",optionsZh:["A. 氧氣 O2","B. 氮氣 N2","C. 二氧化碳 CO2","D. 氫氣 H2"],optionsEn:["A. O2","B. N2","C. CO2","D. H2"],answer:"B",explanationZh:"氮氣佔78%最多，其次氧氣21%。",explanationEn:"N2 78% is most abundant."},{id:"7-2",type:"mc",questionZh:"檢驗氧氣的方法是？",questionEn:"Test for oxygen?",optionsZh:["A. 石灰水變混濁","B. 發光線香復燃","C. 氯化鈷變粉紅","D. 爆鳴測試"],optionsEn:["A. Limewater milky","B. Glowing splint religh y problems."},{id:"7-11",type:"tf",questionZh:"光合作用只在夜間進行。",questionEn:"Photosynthesis only at night.",answer:"False",explanationZh:"需要光，只在日間。",explanationEn:"Needs light, daytime only."},{id:"7-12",type:"tf",questionZh:"植物呼吸作用與光合作用氣體交換方向相反。",questionEn:"Respiration opposite to photosynthesis gas exchange.",answer:"True",explanationZh:"光合O2出CO2入，呼吸相反。",explanationEn:"Opposite directions."}]},{id:"8",strand:"Physical",titleZh:"Unit 8 電的利用 Making Use of Electricity",titleEn:"Unit 8 Electricity",summaryZh:"簡單電路符號閉合開路短路，電流A安培串聯安培計，電壓V伏特並聯伏特計，電阻Ω因素長度橫截面材料溫度變阻器，串聯I相等V相加一斷全滅，並聯V相等I相加獨立家居，家居佈線火線棕中線藍地線黃綠，安全保險絲MCB RCD接地，P=VI E=Pt kWh 效率。",summaryEn:"Simple circuits symbols closed open short, current A series ammeter, voltage V parallel voltmeter, resistance Ω factors length cross-section material temp rheostat, series I equal V sum one fails all off, parallel V equal I sum independent home, domestic wiring Live brown Neutral blue Earth yellow-green, safety fuse MCB RCD earth, P=VI E=Pt kWh efficiency",keyPoints:[{zh:"8.1 電路基礎：閉合電路才有電流 開路無電流 短路電阻極小危險",en:"Circuit basics: closed circuit has current, open no current, short very low resistance dangerous",detailZh:"完整迴路包括電源導線用電器開關，短路電流過大可引發火災。",detailEn:"Complete loop needed, short causes large current heating."},{zh:"8.2 電流與電壓：電流I安培A 串聯量  電壓V伏特V 並聯量",en:"Current I ampere A series measure, voltage V volt V parallel measure",detailZh:"電流是電荷流動速率，安培計串聯；電壓是推動電荷能量，伏特計並聯跨用電器。",detailEn:"Ammeter in series, voltmeter in parallel."},{zh:"8.3 電阻因素：R=ρL/A 長度↑R↑ 橫截面↓R↑ 材料 溫度↑R↑ 變阻器調節",en:"Resistance factors: R=ρL/A length ↑R↑ area ↓R↑ material temp ↑R↑ rheostat",detailZh:"電阻阻礙電流，變阻器滑動改變接入長度控制電流亮度。",detailEn:"Rheostat controls current."},{zh:"8.4 串聯vs並聯：串聯 I相等 V=V1+V2 一斷全斷；並聯 V相等 I=I1+I2 獨立 家居用並聯",en:"Series vs parallel: series I equal V sum one fails all off; parallel V equal I sum independent home uses parallel",detailZh:"聖誕燈舊式串聯缺點，新式並聯或獨立；家居各電器獨立工作互不影響。",detailEn:"Home wiring parallel so appliances independent."},{zh:"8.5 家居佈線：火線Live棕色 危險 中
