ch acid+pepsin for protein → bile emulsifies fats in small intestine, pancreatic enzymes finish. Physical + chemical digestion coordinated."},{id:"n3",zh:"小腸絨毛",en:"Villi",detailZh:"絨毛增加吸收面積約600倍，內有微血管吸收葡萄糖、胺基酸，乳糜管吸收脂肪酸。絨毛擺動加速養分進入血液。",detailEn:"Villi increase absorption area ~600x, with capillaries for glucose/amino acids and lacteals for fatty acids. Villi movement speeds nutrient entry to blood."},{id:"n4",zh:"均衡飲食金字塔",en:"Food Pyramid",detailZh:"底層穀物最多，中層蔬果與蛋白，頂層油糖最少。中二要按活動量調整，避免偏食導致肥胖或營養不良。",detailEn:"Base grains most, middle veg/fruit & protein, top oils/sugars least. F2 students adjust by activity level, avoid picky eating causing obesity or malnutrition."}]},{id:"photosynthesis",strand:"Biology",strandZh:"生物",titleZh:"光合作用",titleEn:"Photosynthesis",summaryZh:"植物在葉綠體利用光能，將二氧化碳和水轉化為葡萄糖與氧氣，是生態系能量來源。",summaryEn:"Plants use light energy in chloroplasts to convert CO2 and water into glucose and oxygen, the energy source of ecosystems.",keyPoints:[{id:"p1",zh:"葉的結構",en:"Leaf Structure",detailZh:"表皮有角質層防失水，氣孔控制氣體進出，柵狀組織含大量葉綠體，進行主要光合作用。",detailEn:"Epidermis with cuticle prevents water loss, stomata control gas exchange, palisade tissue has many chloroplasts for main photosynthesis."},{id:"p2",zh:"光合方程",en:"Equation",detailZh:"6CO₂ + 6H₂O + 光 → C₆H₁₂O₆ + 6O₂，需要光、葉綠素、二氧化碳、水四要素，缺一不可。",detailEn:"6CO₂ + 6H₂O + light → C₆H₁₂O₆ + 6O₂, requires light, chlorophyll, CO₂, water - all essential."},{id:"p3",zh:"影響因素",en:"Factors",detailZh:"光強度、CO₂濃度、溫度都會影響速率，呈飽和曲線，中二實驗用氣泡計數觀察。",detailEn:"Light intensity, CO₂ concentration, temperature affect rate with saturation curve, observed via bubble counting in F2 experiments."},{id:"p4",zh:"生態意義",en:"Ecological Role",detailZh:"光合作用製造有機物，釋放氧氣，維持碳氧循環，是食物鏈第一層能量來源。",detailEn:"Photosynthesis makes organic matter, releases O₂, maintains carbon-oxygen cycle, first energy level of food chain."}]},{id:"cells",strand:"Biology",strandZh:"生物",titleZh:"細胞與顯微鏡",titleEn:"Cells & Microscope",summaryZh:"細胞是生命基本單位，動植物細胞結構異同，顯微鏡操作與放大計算是中二基礎技能。",summaryEn:"Cells are basic units of life, animal vs plant structures differ, microscope operation and magnification calculation are F2 core skills.",keyPoints:[{id:"c1",zh:"顯微鏡操作",en:"Microscope Use",detailZh:"先低倍找目標，再高倍細看，總放大=目鏡x物鏡，光圈與焦距調節清晰度，製作臨時玻片要避免氣泡。",detailEn:"Find target at low power, then high power detail. Total mag = eyepiece x objective. Diaphragm & focus adjust clarity, avoid bubbles in temporary slides."},{id:"c2",zh:"細胞器",en:"Organelles",detailZh:"細胞核控制、粒線體供能、葉綠體光合、細胞壁支撐、液泡儲水。各司其職，分工合作。",detailEn:"Nucleus controls, mitochondria powers, chloroplasts photosynthesize, cell wall supports, vacuole stores water. Each has role, cooperative."},{id:"c3",zh:"動植物差異",en:"Animal vs Plant",detailZh:"植物有細胞壁、葉綠體、大液泡，動物沒有；動物有中心體，植物多數沒有，形狀也不同。",detailEn:"Plants have cell wall, chloroplasts, large vacuole; animals don’t. Animals have centrioles, most plants don’t, shapes differ too."},{id:"c4",zh:"細胞分裂",en:"Cell Division",detailZh:"有絲分裂產生兩個相同子細胞用於生長修補，染色體先複製後平均分配。",detailEn:"Mitosis produces two identical daughter cells for growth/repair, chromosomes duplicate then equally distributed."}]},{id:"atoms",strand:"Chemistry",strandZh:"化學",titleZh:"原子與元素週期",titleEn:"Atoms & Periodic Table",summaryZh:"原子由質子、中子、電子構成，電子排布決定元素性質，週期表按質子數排列。",summaryEn:"Atoms made of protons, neutrons, electrons. Electron arrangement decides properties, periodic table ordered by proton number.",keyPoints:[{id:"a1",zh:"波耳模型",en:"Bohr Model",detailZh:"原子核在中心，電子分層繞行，K層2個，L層8個，M層最多8(中二簡化)，最外層電子決定化學活性。",detailEn:"Nucleus center, electrons orbit in shells: K 2, L 8, M max 8 (F2 simplified). Outer electrons decide reactivity."},{id:"a2",zh:"質子中子電子",en:"Subatomic",detailZh:"質子正電在核，中子不帶電，電子負電繞核，質子數=原子序=電子數(中性原子)，質量數=質子+中子。",detailEn:"Protons positive in nucleus, neutrons neutral, electrons negative orbiting. Proton number = atomic number = electron number (neutral), mass number = p+n."},{id:"a3",zh:"週期規律",en:"Periodic Trends",detailZh:"同族最外層電子相同，性質相似；同週期電子層相同，由左至右金屬性減弱。",detailEn:"Same group has same outer electrons, similar properties; same period same shells, metallic character decreases left to right."},{id:"a4",zh:"離子形成",en:"Ion Formation",detailZh:"原子得失電子達八隅體，金屬失電子成正離子，非金屬得電子成負離子，異性相吸成化合物。",detailEn:"Atoms gain/lose electrons to achieve octet, metals lose to form cations, nonmetals gain to form anions, opposite charges attract to form compounds."}]},{id:"acids",strand:"Chemistry",strandZh:"化學",titleZh:"酸鹼與 pH",titleEn:"Acids, Bases & pH",summaryZh:"酸釋放H+，鹼釋放OH-，pH 0-14 顯示酸鹼度，中和反應產生鹽和水。",summaryEn:"Acids release H+, bases release OH-, pH 0-14 shows acidity, neutralization produces salt and water.",keyPoints:[{id:"ac1",zh:"pH 刻度",en:"pH Scale",detailZh:"0-6酸性，7中性，8-14鹼性，每差1差10倍H+濃度，強酸pH1，強鹼pH14，胃酸約2，漂白水約12。",detailEn:"0-6 acidic, 7 neutral, 8-14 alkaline, each 1 diff = 10x H+ concentration. Strong acid pH1, strong base pH14, stomach ~2, bleach ~12."},{id:"ac2",zh:"指示劑",en:"Indicators",detailZh:"石蕊酸紅鹼藍，酚酞酸無色鹼粉紅，pH紙對照色卡，通用指示劑顯示漸變色。",detailEn:"Litmus red acidic blue alkaline, phenolphthalein colorless acidic pink alkaline, pH paper matches chart, universal indicator shows gradient."},{id:"ac3",zh:"中和",en:"Neutralization",detailZh:"酸+鹼→鹽+水，H+ + OH- → H2O，放熱反應，滴定計算中二重點。",detailEn:"Acid + base → salt + water, H+ + OH- → H2O, exothermic, titration calculation is F2 key point."},{id:"ac4",zh:"日常酸鹼",en:"Everyday",detailZh:"檸檬醋酸，汽水碳酸，肥皂鹼性，過量胃酸用抗酸藥中和，了解酸鹼助安全。",detailEn:"Lemon acetic acid, soda carbonic, soap alkaline, excess stomach acid neutralized by antacids, understanding acids/bases aids safety."}]},{id:"forces",strand:"Physics",strandZh:"物理",titleZh:"力與運動 F=ma",titleEn:"Forces & Motion F=ma",summaryZh:"力改變運動狀態，牛頓三定律描述慣性、F=ma、作用反作用，摩擦與重力是常見力。",summaryEn:"Forces change motion, Newton’s 3 laws describe inertia, F=ma, action-reaction, friction and gravity are common forces.",keyPoints:[{id:"f1",zh:"F=ma",en:"F=ma",detailZh:"合力=質量x加速度，質量越大越難加速，1N=1kg·1m/s²，中二計算要統一單位。",detailEn:"Net force = mass x acceleration, larger mass harder to accelerate, 1N=1kg·1m/s², F2 calculations need unit consistency."},{id:"f2",zh:"重力",en:"Gravity",detailZh:"W=mg，地球g≈10m/s²，質量不變，重量隨星球改變，自由落體加速度相同。",detailEn:"W=mg, Earth g≈10m/s², mass constant, weight changes by planet, free-fall acceleration same."},{id:"f3",zh:"摩擦力",en:"Friction",detailZh:"接觸面阻礙運動，靜摩擦>動摩擦，粗糙與壓力越大摩擦越大，潤滑可減少。",detailEn:"Contact surfaces resist motion, static > kinetic, rougher & more pressure = more friction, lubrication reduces."},{id:"f4",zh:"平衡與合力",en:"Balanced Forces",detailZh:"合力0時靜止或等速，合力非0時加速，力圖要畫箭頭長度表大小。",detailEn:"Net force 0 = stationary or constant speed, non-zero = acceleration, force diagrams arrow length shows magnitude."}]},{id:"energy",strand:"Physics",strandZh:"物理",titleZh:"能量轉換",titleEn:"Energy Transfers",summaryZh:"能量守恆，動能與勢能互轉，最終部分變熱與光，效率計算是中二重點。",summaryEn:"Energy conserved, KE and PE interconvert, eventually partly to heat & light, efficiency calculation is F2 focus.",keyPoints:[{id:"e1",zh:"位能 mgh",en:"Potential mgh",detailZh:"質量m、重力g、高度h決定重力位能，越高位能越大，是儲存的能量。",detailEn:"Mass m, gravity g, height h decide gravitational PE, higher = more PE, stored energy."},{id:"e2",zh:"動能 1/2mv²",en:"Kinetic ½mv²",detailZh:"速度影響平方，速度加倍動能四倍，剎車距離因此大增，安全駕駛關鍵。",detailEn:"Velocity affects squared, double speed = 4x KE, braking distance increases sharply, key to safe driving."},{id:"e3",zh:"能量守恆",en:"Conservation",detailZh:"理想無摩擦時 mgh = 1/2mv²，現實有熱與聲損耗，總能量不變，只是轉換。",detailEn:"Ideal frictionless mgh = ½mv², real life has heat & sound loss, total energy constant, just transforms."},{id:"e4",zh:"效率",en:"Efficiency",detailZh:"有用能量/總輸入 x100%，燈泡約10%光，其餘熱，改善設計可提升效率。",detailEn:"Useful / total input x100%, bulb ~10% light rest heat, improving design raises efficiency."}]},{id:"earth",strand:"Earth",strandZh:"地球",titleZh:"地球與水循環",titleEn:"Earth & Water Cycle",summaryZh:"水經蒸發、凝結、降水循環，岩石循環與板塊運動塑造地貌，天氣與氣候不同。",summaryEn:"Water cycles via evaporation, condensation, precipitation, rock cycle & plate movement shape landforms, weather vs climate differ.",keyPoints:[{id:"ea1",zh:"蒸發凝結",en:"Evaporation Condensation",detailZh
